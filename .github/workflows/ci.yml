name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LedMatrixManager.slnx

      - name: Build
        run: dotnet build LedMatrixManager.slnx -c Debug --no-restore

      - name: Test
        run: dotnet test tests/LedMatrix.Core.Tests/LedMatrix.Core.Tests.csproj -c Debug --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
